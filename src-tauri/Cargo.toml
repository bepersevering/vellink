[package]
name = "vellink"
version = "0.1.0"
description = "A Markdown editor with Typora-like focus and Obsidian-like extensibility"
authors = ["bepersevering"]
edition = "2021"

[lib]
name = "vellink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
